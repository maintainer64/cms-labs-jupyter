apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jupyter
  namespace: $K8S_NAMESPACE
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: cilium
      sectionName: https
  hostnames:
    - "jupyter.${INGRESS_HOSTNAME}"
  rules:
    - backendRefs:
        - name: proxy-public
          port: 80
